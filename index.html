<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routeur VR</title>
<meta name="theme-color" content="#12324A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --mar:#E6EEF2; --superficie:#F6F9FB; --tinta:#12324A; --tinta2:#557086; --linea:#C4D4DD;
  --rojo:#C9413A; --vela:#E3912B; --azul:#2B6C9E; --azul-suave:#D7E6EF; --ok:#2E8A62;
  --radio:10px; --num:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --texto:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --mar:#0C1D2A; --superficie:#12293A; --tinta:#E3ECF1; --tinta2:#93AEBF; --linea:#28465B;
    --rojo:#E8645B; --vela:#F0A646; --azul:#6FA8D4; --azul-suave:#1A3A52; --ok:#57BE8D; color-scheme:dark; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mar);color:var(--tinta);font:16px/1.45 var(--texto);
  padding:env(safe-area-inset-top,0) 0 calc(96px + env(safe-area-inset-bottom,0))}
main{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto;padding:14px 16px 6px}
header img{width:44px;height:44px}
header h1{font:600 26px/1 var(--num);letter-spacing:.2px;margin:0;flex:1}
select,input,button{font:inherit;color:inherit}
.idioma{background:transparent;border:1px solid var(--linea);border-radius:8px;padding:6px 8px}
fieldset{border:0;border-top:1px solid var(--linea);margin:14px 0 0;padding:14px 0 4px}
legend{font:600 18px/1.2 var(--num);padding:0 8px 0 0;color:var(--tinta)}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.campo{display:block;margin:8px 0}
label.campo span{display:block;font-size:14px;color:var(--tinta2);margin-bottom:4px}
input[type=text],input[type=number],select.campo{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--radio);
  border:1px solid var(--linea);background:var(--superficie);font-family:var(--num);font-size:19px;font-weight:500}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.segmento{display:flex;border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden;background:var(--superficie)}
.segmento label{flex:1;position:relative}
.segmento input{position:absolute;opacity:0;inset:0;margin:0}
.segmento span{display:block;text-align:center;padding:11px 4px;font-size:15px;cursor:pointer}
.segmento input:checked+span{background:var(--tinta);color:var(--superficie);font-weight:600}
.segmento input:focus-visible+span{outline:3px solid var(--azul);outline-offset:-3px}
details{margin-top:6px}
summary{cursor:pointer;color:var(--azul);font-weight:500;padding:8px 0;list-style-position:inside}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--tinta)}
.nota{font-size:13px;color:var(--tinta2);margin:4px 0 0}
.boton2{border:1px solid var(--linea);background:var(--superficie);border-radius:var(--radio);padding:10px 14px;cursor:pointer}
.barra-calcular{position:fixed;left:0;right:0;bottom:0;background:var(--mar);border-top:1px solid var(--linea);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0));z-index:1000}
.barra-calcular .dentro{max-width:528px;margin:0 auto}
#calcular{width:100%;min-height:54px;border:0;border-radius:var(--radio);background:var(--tinta);color:var(--superficie);
  font:600 20px/1 var(--num);letter-spacing:.3px;cursor:pointer}
#calcular:disabled{opacity:.6}
.progreso{height:4px;background:var(--azul-suave);border-radius:2px;margin-top:8px;overflow:hidden;display:none}
.progreso i{display:block;height:100%;width:0;background:var(--vela);transition:width .3s}
#estado{font-size:13px;color:var(--tinta2);margin-top:6px;min-height:18px}
#resultado{display:none;margin-top:18px}
.instrumento{background:var(--tinta);color:var(--superficie);border-radius:14px;padding:16px 18px}
.instrumento .rotulo{font-size:14px;opacity:.75}
.instrumento .eta{font:700 38px/1.05 var(--num);letter-spacing:.3px;margin:4px 0 2px}
.instrumento .dur{font:500 20px/1.2 var(--num);opacity:.85}
.instrumento .aviso{font-size:14px;color:var(--vela);margin-top:8px}
.instrumento .aviso:empty{display:none}
#mapa{height:56vh;min-height:300px;border-radius:14px;margin-top:12px;border:1px solid var(--linea);background:var(--azul-suave)}
.vista{margin:16px 0 8px}
ol.lista{list-style:none;margin:0;padding:0}
ol.lista li{display:grid;grid-template-columns:88px 64px 1fr auto;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--linea)}
ol.lista li .h{font:500 15px/1.2 var(--num);color:var(--tinta2)}
ol.lista li .twa{font:700 22px/1 var(--num)}
ol.lista li .vel{font-size:14px;color:var(--tinta2)}
ol.lista li .vela{font:600 15px/1 var(--num)}
ol.lista li.man{background:linear-gradient(90deg,color-mix(in srgb,var(--vela) 22%,transparent),transparent)}
.evento{grid-column:1/-1;font:600 14px/1 var(--num);color:var(--vela);letter-spacing:.3px}
.leaflet-container{font:13px var(--texto)}
.leaflet-tooltip{font:500 13px var(--num)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0}
.chip span{display:inline-block;padding:8px 12px;border:1px solid var(--linea);border-radius:999px;background:var(--superficie);font:500 16px/1 var(--num);cursor:pointer}
.chip input:checked+span{background:var(--tinta);color:var(--superficie);border-color:var(--tinta)}
.chip input:checked+span::before{content:"✓ "}
.chip input:focus-visible+span{outline:3px solid var(--azul);outline-offset:2px}
.ordenes{width:100%;border-collapse:collapse;font-family:var(--num);font-size:16px}
.ordenes th{font:500 13px/1.2 var(--texto);color:var(--tinta2);text-align:left;padding:4px 4px 6px;border-bottom:1px solid var(--linea)}
.ordenes td{padding:7px 3px;border-bottom:1px solid color-mix(in srgb,var(--linea) 55%,transparent);white-space:nowrap}
.ordenes td.h{font-weight:600}
.ordenes td.d,.ordenes td.a{color:var(--tinta2)}
.ordenes td.o{font-weight:700;font-size:16px}
.ordenes td.v{white-space:normal}
.ordenes tr.dia td{font:600 13px/1.2 var(--texto);color:var(--tinta2);padding:10px 4px 4px;border-bottom:1px solid var(--linea);background:transparent}
.ordenes tr.man td{background:color-mix(in srgb,var(--vela) 18%,transparent)}
.ordenes .nota-v{display:block;color:var(--vela);font:600 12px/1.2 var(--texto);margin-top:2px;white-space:normal}
.ordenes tr.fin td{font-weight:600}
.guion{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
h2.sub{font:600 20px/1.2 var(--num);margin:20px 0 6px}
ol.clave{list-style:none;margin:0;padding:0;border-left:3px solid var(--azul);margin-left:6px}
ol.clave li{position:relative;padding:8px 4px 10px 16px}
ol.clave li::before{content:"";position:absolute;left:-8px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--superficie);border:2px solid var(--azul)}
ol.clave li.man::before{background:var(--vela);border-color:var(--vela)}
ol.clave .cuando{font:500 15px/1.2 var(--num);color:var(--tinta2)}
ol.clave .accion{font:700 21px/1.2 var(--num)}
ol.clave li.man .accion{color:var(--vela)}
ol.clave .detalle{font-size:14px;color:var(--tinta2)}
.vacio{color:var(--tinta2);font-size:15px;padding:6px 0}
#comparar{width:100%;min-height:44px;margin-top:8px;border:1px solid var(--tinta);border-radius:var(--radio);background:transparent;color:var(--tinta);font:600 17px/1 var(--num);cursor:pointer}
#comparar:disabled{opacity:.5}
#comparacion{display:none;margin-top:18px;background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:14px 16px}
#comparacion table{width:100%;border-collapse:collapse;font-size:15px}
#comparacion td{padding:8px 4px;border-bottom:1px solid var(--linea)}
#comparacion td.g{font:700 18px/1 var(--num);text-align:right;white-space:nowrap}
#comparacion tr.mejor td.g{color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="" width="44" height="44">
  <h1 data-t="titulo">Routeur VR</h1>
  <select id="idioma" class="idioma" aria-label="Idioma">
    <option value="es">ES</option><option value="fr">FR</option><option value="en">EN</option>
  </select>
</header>
<main>
  <fieldset>
    <legend data-t="barco"></legend>
    <div class="fila">
      <label class="campo"><span data-t="lat"></span><input id="lat" type="text" autocomplete="off" placeholder="43 37 53 N"></label>
      <label class="campo"><span data-t="lon"></span><input id="lon" type="text" autocomplete="off" placeholder="032 13 34 W"></label>
    </div>
    <div class="campo"><span data-t="misVelas" style="display:block;font-size:14px;color:var(--tinta2)"></span>
      <div class="chips" id="misVelas"></div>
      <p class="nota" data-t="misVelasAyuda"></p></div>
    <label class="campo"><span data-t="vela"></span><select id="vela" class="campo"></select></label>
    <div class="campo"><span data-t="amura" style="display:block;font-size:14px;color:var(--tinta2);margin-bottom:4px"></span>
      <div class="segmento" role="radiogroup">
        <label><input type="radio" name="amura" value="1"><span data-t="estribor"></span></label>
        <label><input type="radio" name="amura" value="-1"><span data-t="babor"></span></label>
        <label><input type="radio" name="amura" value="0" checked><span data-t="nose"></span></label>
      </div>
    </div>
    <label class="campo"><span data-t="twaActual"></span><input id="twaActual" type="text" inputmode="decimal" autocomplete="off" placeholder="−64"></label>
    <label class="campo"><span data-t="energia"></span><input id="energia" type="number" min="0" max="100" inputmode="numeric"></label>
  </fieldset>

  <fieldset>
    <legend data-t="destino"></legend>
    <div class="fila">
      <label class="campo"><span data-t="lat"></span><input id="latLl" type="text" autocomplete="off"></label>
      <label class="campo"><span data-t="lon"></span><input id="lonLl" type="text" autocomplete="off"></label>
    </div>
    <details id="detVia">
      <summary data-t="via"></summary>
      <div class="fila">
        <label class="campo"><span data-t="lat"></span><input id="latVia" type="text" autocomplete="off"></label>
        <label class="campo"><span data-t="lon"></span><input id="lonVia" type="text" autocomplete="off"></label>
      </div>
    </details>
  </fieldset>

  <fieldset>
    <legend data-t="opciones"></legend>
    <div class="segmento" role="radiogroup" style="margin-top:4px">
      <label><input type="radio" name="paso" value="1" checked><span data-t="rapido"></span></label>
      <label><input type="radio" name="paso" value="0.5"><span data-t="preciso"></span></label>
    </div>
    <label class="check"><input type="checkbox" id="foils"><span data-t="foils"></span></label>
    <label class="check"><input type="checkbox" id="winch"><span data-t="winch"></span></label>
    <div class="fila" style="margin-top:8px">
      <label class="campo"><span data-t="puntosProg"></span><select id="puntos" class="campo"><option>2</option><option>5</option><option>9</option><option>15</option></select></label>
      <label class="campo"><span data-t="horizonte"></span><select id="horizonte" class="campo"><option value="6">6 h</option><option value="12">12 h</option><option value="24">24 h</option><option value="48">48 h</option></select></label>
    </div>
    <label class="check"><input type="checkbox" id="forzar"><span data-t="forzar"></span></label>
    <label class="check"><input type="checkbox" id="demo"><span data-t="demo"></span></label>
    <details>
      <summary data-t="polares"></summary>
      <p class="nota" id="polaresInfo"></p>
      <p class="nota" data-t="polaresAyuda"></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <label class="boton2"><span data-t="importar"></span><input id="importar" type="file" accept=".csv,text/csv" multiple hidden></label>
        <button class="boton2" id="restaurar" type="button" data-t="restaurar"></button>
      </div>
    </details>
  </fieldset>

  <section id="resultado" aria-live="polite">
    <div class="instrumento">
      <div class="rotulo" data-t="llegadaEst"></div>
      <div class="eta" id="eta"></div>
      <div class="dur" id="dur"></div>
      <div class="aviso" id="avisoRes"></div>
    </div>
    <h2 class="sub" data-t="clave"></h2>
    <div id="clave"></div>
    <div id="mapa"></div>
    <div class="segmento vista" role="radiogroup">
      <label><input type="radio" name="vista" value="cambios" checked><span data-t="cambios"></span></label>
      <label><input type="radio" name="vista" value="todo"><span data-t="todo"></span></label>
    </div>
    <div id="lista"></div>
  </section>
  <section id="comparacion" aria-live="polite"></section>
</main>
<div class="barra-calcular"><div class="dentro">
  <button id="calcular" type="button" data-t="calcular"></button>
  <button id="comparar" type="button" data-t="comparar"></button>
  <div class="progreso" id="progreso"><i></i></div>
  <div id="estado" role="status"></div>
</div></div>

<script type="text/plain" id="motor">/* Motor del routeur (isócronas). Se ejecuta en un Web Worker.
   Entrada: {polares, viento, tierra, puntos, t0, cfg}. Salida: mensajes 'prog' y 'fin'. */
const R_MN = 3440.065, D2R = Math.PI / 180;

function dist(la1, lo1, la2, lo2) {
  const p1 = la1 * D2R, p2 = la2 * D2R, dp = p2 - p1, dl = (lo2 - lo1) * D2R;
  const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R_MN * Math.asin(Math.sqrt(Math.min(1, Math.max(0, a))));
}
function rumbo(la1, lo1, la2, lo2) {
  const p1 = la1 * D2R, p2 = la2 * D2R, dl = (lo2 - lo1) * D2R;
  const x = Math.sin(dl) * Math.cos(p2), y = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(x, y) / D2R + 360) % 360;
}
function avanzar(la, lo, cap, d) {
  const p1 = la * D2R, l1 = lo * D2R, c = cap * D2R, dd = d / R_MN;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(dd) + Math.cos(p1) * Math.sin(dd) * Math.cos(c));
  const l2 = l1 + Math.atan2(Math.sin(c) * Math.sin(dd) * Math.cos(p1), Math.cos(dd) - Math.sin(p1) * Math.sin(p2));
  return [p2 / D2R, ((l2 / D2R) + 540) % 360 - 180];
}
const n180 = a => ((a % 360) + 540) % 360 - 180;

/* ---------- polares ---------- */
function interp1(xs, ys, x) {
  if (x <= xs[0]) return ys[0];
  const n = xs.length;
  if (x >= xs[n - 1]) return ys[n - 1];
  let i = 1; while (xs[i] < x) i++;
  const w = (x - xs[i - 1]) / (xs[i] - xs[i - 1]);
  return ys[i - 1] * (1 - w) + ys[i] * w;
}
function filaEnTws(p, tws) { return p.v.map(fila => interp1(p.tws, fila, tws)); }
const rampa = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a)));
function factorFoils(twa, tws) {
  return 1 + 0.04 * rampa(tws, 11, 16) * (1 - rampa(tws, 35, 40)) * rampa(twa, 60, 70) * (1 - rampa(twa, 160, 170));
}

/* ---------- viento ---------- */
function crearViento(w) {
  const H = w.horas, LA = w.lats, LO = w.lons, nla = LA.length, nlo = LO.length;
  const u = w.u, v = w.v;
  function idx(arr, x) {
    const n = arr.length;
    if (x <= arr[0]) return [0, 0];
    if (x >= arr[n - 1]) return [n - 2, 1];
    const paso = arr[1] - arr[0];
    let i = Math.min(n - 2, Math.max(0, Math.floor((x - arr[0]) / paso)));
    while (i < n - 2 && arr[i + 1] < x) i++;
    while (i > 0 && arr[i] > x) i--;
    return [i, (x - arr[i]) / (arr[i + 1] - arr[i])];
  }
  return function (h, la, lo) {
    const [it, wt] = idx(H, h), [ia, wa] = idx(LA, la), [io, wo] = idx(LO, lo);
    let uu = 0, vv = 0;
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let c = 0; c < 2; c++) {
      const peso = (a ? wt : 1 - wt) * (b ? wa : 1 - wa) * (c ? wo : 1 - wo);
      if (!peso) continue;
      const k = ((it + a) * nla + (ia + b)) * nlo + (io + c);
      uu += peso * u[k]; vv += peso * v[k];
    }
    return [Math.hypot(uu, vv), (Math.atan2(-uu, -vv) / D2R + 360) % 360];
  };
}

/* ---------- tierra ---------- */
function crearTierra(t) {
  if (!t) { const f = () => 0; f.cerca = () => 0; return f; }
  const { lat0, lon0, res, nlat, nlon, bits } = t;
  const fino = function (la, lo) {
    const i = Math.floor((la - lat0) / res), j = Math.floor((lo - lon0) / res);
    if (i < 0 || j < 0 || i >= nlat || j >= nlon) return 0;
    const k = i * nlon + j;
    return (bits[k >> 3] >> (7 - (k & 7))) & 1;
  };
  // bloques de 0,5°: 1 si hay tierra en el bloque o en sus vecinos (para saltarse la comprobación en alta mar)
  const B = Math.round(0.5 / res), nbi = Math.ceil(nlat / B), nbj = Math.ceil(nlon / B);
  const bloque = new Uint8Array(nbi * nbj);
  for (let i = 0; i < nlat; i++) for (let j = 0; j < nlon; j++) {
    const k = i * nlon + j;
    if ((bits[k >> 3] >> (7 - (k & 7))) & 1) bloque[Math.floor(i / B) * nbj + Math.floor(j / B)] = 1;
  }
  const dil = new Uint8Array(nbi * nbj);
  for (let i = 0; i < nbi; i++) for (let j = 0; j < nbj; j++) {
    if (!bloque[i * nbj + j]) continue;
    for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) {
      const ii = i + di, jj = j + dj;
      if (ii >= 0 && jj >= 0 && ii < nbi && jj < nbj) dil[ii * nbj + jj] = 1;
    }
  }
  fino.cerca = function (la, lo) {
    const i = Math.floor((la - lat0) / res / B), j = Math.floor((lo - lon0) / res / B);
    if (i < 0 || j < 0 || i >= nbi || j >= nbj) return 0;
    return dil[i * nbj + j];
  };
  return fino;
}

/* ---------- un tramo ---------- */
function tramo(ctx, salida, meta, t0, vela0, amura0) {
  const { velas, viento, enTierra, cfg } = ctx;
  // ángulos probados (una amura); la otra amura da la misma velocidad
  const As = [];
  for (let a = cfg.twaMin; a <= 180.001; a += cfg.pasoTwa) As.push(Math.min(a, 180));
  const nA = As.length, nS = velas.length, tRef = cfg.tRef ?? t0;
  // paso variable, como los routers de referencia: 10 min las 6 primeras horas, 30 min hasta 24 h, luego el elegido
  const pasoEn = h => h < 6 ? 1 / 6 : h < 24 ? Math.min(0.5, cfg.paso) : cfg.paso;
  let dt = pasoEn(t0 - tRef);
  const cosA = As.map(a => Math.cos(a * D2R)), sinA = As.map(a => Math.sin(a * D2R));
  // posición de cada ángulo en la tabla de cada vela (interpolación precalculada)
  const pos = velas.map(p => As.map(a => {
    const xs = p.twa; let k = 1;
    if (a <= xs[0]) return [0, 0];
    if (a >= xs[xs.length - 1]) return [xs.length - 2, 1];
    while (xs[k] < a) k++;
    return [k - 1, (a - xs[k - 1]) / (xs[k] - xs[k - 1])];
  }));
  const fa = As.map(a => rampa(a, 60, 70) * (1 - rampa(a, 160, 170)));
  // Reglas de la ayuda de Virtual Regatta (Class40): virada/trasluchada 3→5 min, vela 4→6 min (de 10 a 30 nudos),
  // barco al 50 % durante la maniobra (70 % con Winchs Pro); energía: amura 10 %, vela 20 % × coef. de viento;
  // tiempo × (2 − 1,5·E/100); recuperación 1 % cada 5 min (poco viento) a 15 min (30 nudos o más).
  const base = (a, b, tws) => a + (b - a) * rampa(tws, 10, 30);
  const coefT = e => 2 - 1.5 * Math.min(100, Math.max(0, e)) / 100;
  const coefE = tws => tws <= 10 ? 1 + 0.02 * tws : tws <= 20 ? 1.2 + 0.03 * (tws - 10) : tws <= 30 ? 1.5 + 0.05 * (tws - 20) : 2;
  const minPunto = tws => { const X = [0, 5, 10, 15, 20, 25, 30], Y = [5, 5.2, 7, 10, 13, 14.6, 15];
    if (tws >= 30) return 15; let k = 1; while (X[k] < tws) k++; return Y[k - 1] + (Y[k] - Y[k - 1]) * (tws - X[k - 1]) / (X[k] - X[k - 1]); };
  const perdida = cfg.winch ? 0.3 : 0.5;
  // devuelve [horas perdidas equivalentes, energía tras la maniobra]
  const penal = (vAnt, vNew, aAnt, aNew, tws, e) => {
    let tmin = 0;
    if (aAnt !== 0 && aAnt !== aNew) { tmin += base(3, 5, tws) * coefT(e); e -= 10 * coefE(tws); }
    if (vAnt >= 0 && vAnt !== vNew) { tmin += base(4, 6, tws) * coefT(e); e -= 20 * coefE(tws); }
    return [tmin / 60 * perdida, Math.max(0, e)];
  };
  const recup = (e, tws) => Math.min(100, e + dt * 60 / minPunto(tws));
  const velMejor = (filas, twaAbs, tws) => {
    let best = -1, s = 0;
    for (let k = 0; k < nS; k++) {
      let v = interp1(velas[k].twa, filas[k], twaAbs);
      if (!cfg.foils) v /= factorFoils(twaAbs, tws);
      if (v > best) { best = v; s = k; }
    }
    return [best, s];
  };
  const cercaMeta = (la, lo) => dist(la, lo, meta[0], meta[1]) < 8;
  const la0 = salida[0], lo0 = salida[1];

  let P = { lat: [salida[0]], lon: [salida[1]], vela: [vela0], amura: [amura0], en: [cfg.energia ?? 100], dm: [99] };
  const hist = [{ lat: P.lat, lon: P.lon, padre: [-1], en: P.en, t: t0 }];
  let ultIso = t0;
  const isos = [];
  let t = t0, paso = 0;
  const d0 = dist(salida[0], salida[1], meta[0], meta[1]);
  const velS = new Float64Array(nA), selS = new Int32Array(nA);

  while (t - t0 < cfg.maxHoras) {
    const N = P.lat.length;
    dt = pasoEn(t - tRef);
    // 1) ¿llegada en este paso?
    let mejorT = Infinity, mejorI = -1, mejorDatos = null;
    const vientos = new Array(N), filas = new Array(N);
    for (let i = 0; i < N; i++) {
      const w = viento(t, P.lat[i], P.lon[i]);
      vientos[i] = w;
      filas[i] = velas.map(p => filaEnTws(p, w[0]));
      const dm = dist(P.lat[i], P.lon[i], meta[0], meta[1]);
      if (dm > 40 * dt) continue;
      const [tws, twd] = w;
      const cm = rumbo(P.lat[i], P.lon[i], meta[0], meta[1]);
      const twaM = n180(twd - cm), aM = Math.abs(twaM);
      const [v, s] = velMejor(filas[i], aM, tws);
      const [pen] = penal(P.vela[i], s, P.amura[i], Math.sign(twaM), tws, P.en[i]);
      if (v * Math.max(dt - pen, 0) < dm && dm > 1.5 * cfg.sectorMn) continue;
      const [mla, mlo] = avanzar(P.lat[i], P.lon[i], cm, dm / 2);
      if (!cercaMeta(mla, mlo) && enTierra(mla, mlo)) continue;
      const tl = t + pen + dm / Math.max(v, 1e-6);
      if (tl < mejorT) { mejorT = tl; mejorI = i; mejorDatos = { cap: cm, twa: twaM, vela: s, v, tws, twd }; }
    }
    if (mejorI >= 0) {
      hist.push({ lat: [meta[0]], lon: [meta[1]], padre: [mejorI], cap: [mejorDatos.cap], twa: [mejorDatos.twa],
        vela: [mejorDatos.vela], v: [mejorDatos.v], tws: [mejorDatos.tws], twd: [mejorDatos.twd], en: [0], t: mejorT });
      return { pasos: reconstruir(hist, 0, mejorT), isos, llegado: true };
    }
    // 2) expandir (cálculos rápidos: avance en plano local, sin trigonometría por candidato)
    const cap0 = N * nA * 2;
    const C = { lat: new Float64Array(cap0), lon: new Float64Array(cap0), padre: new Int32Array(cap0),
      cap: new Float32Array(cap0), twa: new Float32Array(cap0), vela: new Int8Array(cap0), v: new Float32Array(cap0),
      tws: new Float32Array(cap0), twd: new Float32Array(cap0), b: new Float64Array(cap0), d: new Float64Array(cap0),
      en: new Float32Array(cap0), dm: new Float32Array(cap0) };
    let M = 0;
    for (let i = 0; i < N; i++) {
      const [tws, twd] = vientos[i];
      const ft = cfg.foils ? 0 : rampa(tws, 11, 16) * (1 - rampa(tws, 35, 40));
      for (let k = 0; k < nA; k++) {
        let best = -1, sb = 0;
        for (let s = 0; s < nS; s++) {
          const f = filas[i][s], [ix, wx] = pos[s][k];
          let v = f[ix] * (1 - wx) + f[ix + 1] * wx;
          if (ft) v /= 1 + 0.04 * ft * fa[k];
          if (v > best) { best = v; sb = s; }
        }
        velS[k] = best; selS[k] = sb;
      }
      const la = P.lat[i], lo = P.lon[i];
      const ct = Math.cos(twd * D2R), st = Math.sin(twd * D2R), cl = Math.max(0.05, Math.cos(la * D2R));
      for (let k = 0; k < nA; k++) {
        const v = velS[k];
        if (v < 0.05) continue;
        for (let S = 1; S >= -1; S -= 2) {
          const cambia = P.amura[i] !== 0 && P.amura[i] !== S;
          if (cambia && P.dm[i] < (cfg.bordoMin ?? 2)) continue;   // no volver a virar antes de 2 h (zigzags del cálculo)
          const [pen, eTras] = penal(P.vela[i], selS[k], P.amura[i], S, tws, P.en[i]);
          const d = v * Math.max(dt - pen, 0);
          if (d <= 0.01) continue;
          // cap = twd - S*A
          const cc = ct * cosA[k] + st * S * sinA[k], sc = st * cosA[k] - ct * S * sinA[k];
          const nla = la + d * cc / 60, nlo = lo + d * sc / (60 * cl);
          if (enTierra.cerca(nla, nlo) && (enTierra(nla, nlo) || enTierra((la + nla) / 2, (lo + nlo) / 2))) continue;
          const x = (nlo - lo0) * Math.cos((nla + la0) / 2 * D2R), y = nla - la0;
          C.lat[M] = nla; C.lon[M] = nlo; C.padre[M] = i;
          C.cap[M] = ((twd - S * As[k]) % 360 + 360) % 360; C.twa[M] = S * As[k];
          C.vela[M] = selS[k]; C.v[M] = v; C.tws[M] = tws; C.twd[M] = twd; C.en[M] = recup(eTras, tws); C.dm[M] = cambia ? 0 : P.dm[i] + dt;
          C.b[M] = Math.atan2(x, y); C.d[M] = 60 * Math.hypot(x, y); M++;
        }
      }
    }
    if (!M) break;
    // 3) podar por sectores vistos desde la salida
    const muestra = [];
    for (let m = 0; m < M; m += 11) muestra.push(C.d[m]);
    muestra.sort((x, y) => x - y);
    const med = Math.max(muestra[muestra.length >> 1] || 1, 1);
    const ang = Math.min(0.5 * D2R, Math.max(0.03 * D2R, cfg.sectorMn / med));
    const mejor = new Map();
    for (let m = 0; m < M; m++) {
      const sec = Math.floor(C.b[m] / ang), e = mejor.get(sec);
      if (e === undefined || C.d[m] > C.d[e]) mejor.set(sec, m);
    }
    // descartar puntos que se alejan demasiado (fuera de una elipse salida-meta)
    const keep = Array.from(mejor.values()).filter(m =>
      C.d[m] + dist(C.lat[m], C.lon[m], meta[0], meta[1]) <= cfg.elipse * d0 + 30);
    if (!keep.length) break;
    const H = {};
    for (const key of ["lat", "lon", "padre", "cap", "twa", "vela", "v", "tws", "twd", "en", "dm"]) H[key] = keep.map(m => C[key][m]);
    H.t = t + dt;
    hist.push(H);
    P = { lat: H.lat, lon: H.lon, vela: H.vela, amura: H.twa.map(Math.sign), en: H.en, dm: H.dm };
    t += dt; paso++;
    if (t - ultIso >= 6 - 1e-6) {
      ultIso = t;
      const ord = keep.map((m, i) => [C.b[m], i]).sort((x, y) => x[0] - y[0]);
      isos.push(ord.map(([, i]) => [H.lat[i], H.lon[i]]));
    }
    let dmin = Infinity;
    for (let i = 0; i < H.lat.length; i++) dmin = Math.min(dmin, dist(H.lat[i], H.lon[i], meta[0], meta[1]));
    postMessage({ tipo: "prog", horas: t - t0, avance: Math.max(0, 1 - dmin / d0) });
  }
  let i = 0, dmin = Infinity;
  for (let k = 0; k < P.lat.length; k++) {
    const d = dist(P.lat[k], P.lon[k], meta[0], meta[1]);
    if (d < dmin) { dmin = d; i = k; }
  }
  return { pasos: reconstruir(hist, i, null), isos, llegado: false };
}

function reconstruir(hist, iFinal, tLlegada) {
  const ultimo = hist.length - 1;
  let idx = tLlegada === null ? iFinal : 0;
  const cadena = [];
  for (let k = ultimo; k > 0; k--) {
    const h = hist[k];
    cadena.push({ lat: h.lat[idx], lon: h.lon[idx], cap: h.cap[idx], twa: h.twa[idx], vela: h.vela[idx], v: h.v[idx], tws: h.tws[idx], twd: h.twd[idx], en: h.en[idx] });
    idx = h.padre[idx];
  }
  cadena.reverse();
  const pasos = [];
  let la = hist[0].lat[0], lo = hist[0].lon[0], en = hist[0].en[0];
  cadena.forEach((m, k) => {
    pasos.push({ t: hist[k].t, lat: la, lon: lo, cap: m.cap, twa: m.twa, vela: m.vela, v: m.v, tws: m.tws, twd: m.twd, en });
    la = m.lat; lo = m.lon; en = m.en;
  });
  pasos.push({ t: tLlegada !== null ? tLlegada : hist[hist.length - 1].t, lat: la, lon: lo, fin: true });
  return pasos;
}

/* ---------- viento de demostración ---------- */
function vientoDemo(h0) {
  const lats = [], lons = [], horas = [];
  for (let a = 0; a <= 60; a++) lats.push(a);
  for (let o = -80; o <= 0; o++) lons.push(o);
  for (let h = 0; h <= 240; h += 3) horas.push(h0 + h);
  const nla = lats.length, nlo = lons.length, u = new Float32Array(horas.length * nla * nlo), v = new Float32Array(u.length);
  const uv = (dir, vel) => [-vel * Math.sin(dir * D2R), -vel * Math.cos(dir * D2R)];
  horas.forEach((hh, k) => {
    const h = hh - h0;
    for (let i = 0; i < nla; i++) for (let j = 0; j < nlo; j++) {
      const LA = lats[i], LO = lons[j];
      const f = Math.min(1, Math.max(0, (LA - 28) / 14));
      const [ub, vb] = uv(70 * (1 - f) + 250 * f, 16 - 4 * Math.sin(Math.PI * f));
      const cla = 34 + 0.01 * h, clo = -40 + 0.04 * h;
      const dx = (LO - clo) * Math.cos(LA * D2R), dy = LA - cla, r = Math.hypot(dx, dy) + 1e-6;
      const fuerza = 14 * Math.min(1, r / 7) * Math.exp(-Math.max(0, r - 7) / 8), peso = Math.exp(-((r / 9) ** 2));
      const q = (k * nla + i) * nlo + j;
      u[q] = (1 - peso) * ub + peso * fuerza * dy / r;
      v[q] = (1 - peso) * vb + peso * fuerza * -dx / r;
    }
  });
  return { horas, lats, lons, u, v };
}

/* ---------- entrada del worker ---------- */
onmessage = function (e) {
  try {
    const { polares, viento, tierra, puntos, t0, cfg, vela0, amura0 } = e.data;
    const w = cfg.demo ? vientoDemo(t0) : viento;
    cfg.tRef = t0;
    const ctx = { velas: polares, viento: crearViento(w), enTierra: crearTierra(tierra), cfg };
    let todos = [], isos = [], t = t0, v0 = vela0, a0 = amura0, ultimo = null, llegado = true;
    for (let k = 0; k < puntos.length - 1; k++) {
      postMessage({ tipo: "tramo", k: k + 1, n: puntos.length - 1 });
      const r = tramo(ctx, puntos[k], puntos[k + 1], t, v0, a0);
      isos = isos.concat(r.isos);
      const movs = r.pasos.filter(p => !p.fin);
      todos = todos.concat(movs);
      if (movs.length) { v0 = movs[movs.length - 1].vela; a0 = Math.sign(movs[movs.length - 1].twa); }
      ultimo = r.pasos[r.pasos.length - 1];
      t = ultimo.t;
      if (!r.llegado) { llegado = false; break; }
    }
    todos.push(ultimo);
    postMessage({ tipo: "fin", pasos: todos, isos, llegado, horaFinPrevision: w.horas[w.horas.length - 1] });
  } catch (err) {
    postMessage({ tipo: "error", mensaje: String(err && err.stack || err) });
  }
};

function coord(s) {
  s = String(s || "").trim().toUpperCase().replace(/,/g, ".");
  const n = (s.match(/\d+(?:\.\d+)?/g) || []).map(Number);
  if (!n.length) return null;
  const v = n[0] + (n[1] || 0) / 60 + (n[2] || 0) / 3600;

function tablaOrdenes(r, filas, fin) {
  const dia = h => new Intl.DateTimeFormat(idioma, { weekday: "short", day: "2-digit", month: "2-digit" }).format(new Date(h * 3.6e6));
  const hora = h => new Intl.DateTimeFormat(idioma, { hour: "2-digit", minute: "2-digit" }).format(new Date(h * 3.6e6));
  let html = `<div style="overflow-x:auto"><table class="ordenes"><thead><tr><th>${t("colHora")}</th><th>${t("colDesde")}</th><th>${t("colOrden")}</th><th>${t("colAmura")}</th><th>${t("colVela")}</th></tr></thead><tbody>`;
  let diaAnt = "";
  for (const p of filas) {
    const d = dia(p.t);
    if (d !== diaAnt) { html += `<tr class="dia"><td colspan="5">${d}</td></tr>`; diaAnt = d; }
    const objetivo = p.modo === "TWA" ? p.valor : p.twa;
    const ahora = p.ahora && r.twaActual != null && Math.abs(r.twaActual - objetivo) >= 3 ? ` (${t("ahoraTwa", { a: fTwa(r.twaActual) })})` : "";
    const nombre = r.velas[p.vela], nota = p.ahora ? t("ajustarYa") + ahora : p.evento;
    html += `<tr class="${p.evento ? "man" : ""}"><td class="h">${hora(p.t)}</td><td class="d">${fDesde(p.t - r.t0)}</td>
      <td class="o">${p.modo ? fOrden(p) : "TWA " + fTwa(p.twa)}</td><td class="a">${p.twa > 0 ? t("estr") : t("bab")}</td>
      <td class="v"><span class="guion" style="background:${COLOR_VELA[nombre] || "var(--tinta2)"}"></span>${esc(nombre)}${nota ? `<span class="nota-v">${nota}</span>` : ""}</td></tr>`;
  }
  if (fin) html += `<tr class="fin"><td class="h">${hora(fin.t)}</td><td class="d">${fDesde(fin.t - r.t0)}</td><td class="o">⚑</td><td></td><td>${t("llegada")}</td></tr>`;
  return html + "</tbody></table></div>";
}
function pintarClave(r, filas) {
  const m = momentosClave(r, filas);
  document.querySelector("[data-t=clave]").textContent = t("clave", { n: m.length, h: $("horizonte").value });
  $("clave").innerHTML = tablaOrdenes(r, m) + (m.length <= 1 ? `<p class="vacio">${t("sinCambios")}</p>` : "");
}
function pintarResultado(r) {
  $("resultado").style.display = "block";
  const fin = r.pasos.at(-1), dur = fin.t - r.t0;
  $("eta").textContent = fmtEta(fin.t);
  $("dur").textContent = `${Math.floor(dur / 24)} ${t("dias")} ${Math.round(dur % 24)} h`;
  $("avisoRes").textContent = !r.llegado ? t("noLlega") : (!$("demo").checked && fin.t > r.horaFinPrevision ? t("masAlla") : "");
  const filas = eventos(r.pasos, r.velas);
  pintarClave(r, filas);
  const vista = document.querySelector("input[name=vista]:checked").value;
  const mostrar = vista === "cambios" ? cambios(filas) : filas;
  $("lista").innerHTML = tablaOrdenes(r, mostrar, fin);
  pintarMapa(r);
}
function pintarMapa(r) {
  if (typeof L === "undefined") return;
  if (!mapa) {
    mapa = L.map("mapa", { zoomControl: true, attributionControl: true });
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 13, attribution: "Esri, GEBCO, NOAA" }).addTo(mapa);
  }
  if (capa) capa.remove();
  capa = L.layerGroup().addTo(mapa);
  const css = getComputedStyle(document.documentElement);
  const rojo = css.getPropertyValue("--rojo").trim() || "#C9413A", azul = "#2B6C9E";
  r.isos.forEach(iso => L.polyline(iso, { color: azul, weight: 1, opacity: .45, interactive: false }).addTo(capa));
  const linea = r.pasos.map(p => [p.lat, p.lon]);
  L.polyline(linea, { color: rojo, weight: 4 }).addTo(capa);
  r.pasos.forEach((p, i) => { if (i % 6 === 0 && !p.fin) L.circleMarker([p.lat, p.lon], { radius: 3, color: rojo, weight: 2 }).bindTooltip(fmtHora(p.t)).addTo(capa); });
  r.puntos.forEach((p, i) => L.circleMarker(p, { radius: 7, color: "#12324A", fillColor: i === r.puntos.length - 1 ? rojo : "#fff", fillOpacity: 1, weight: 2 })
    .bindTooltip(i === 0 ? t("salida") : i === r.puntos.length - 1 ? t("llegada") : t("marca")).addTo(capa));
  setTimeout(() => { mapa.invalidateSize(); mapa.fitBounds(L.latLngBounds(linea).pad(0.15)); }, 50);
}

/* ---------------- arranque ---------------- */
cargarAjustes();
aplicarIdioma();
$("idioma").addEventListener("change", e => { idioma = e.target.value; guardarAjustes(); aplicarIdioma(); });
$("calcular").addEventListener("click", calcular);
$("comparar").addEventListener("click", comparar);
// al escribir el TWA, la amura se marca sola
$("twaActual").addEventListener("input", () => {
  const x = leerTwa();
  if (x !== null) document.querySelector(`input[name=amura][value="${Math.sign(x)}"]`).checked = true;
});
["puntos", "horizonte"].forEach(id => $(id).addEventListener("change", () => { guardarAjustes(); if (ultimo) pintarResultado(ultimo); }));
document.querySelectorAll("input[name=vista]").forEach(x => x.addEventListener("change", () => ultimo && pintarResultado(ultimo)));
["vela", "foils", "demo", ...CAMPOS].forEach(c => $(c).addEventListener("change", guardarAjustes));
document.querySelectorAll("input[name=amura],input[name=paso]").forEach(x => x.addEventListener("change", guardarAjustes));
$("importar").addEventListener("change", async e => {
  const nuevas = [];
  for (const f of e.target.files) {
    try { nuevas.push(leerCSV(f.name, await f.text())); } catch (err) { estado(t("importErr", { f: f.name })); return; }
  }
  if (nuevas.length) { guardar("vr_polares", nuevas); pintarPolares(); estado(t("importOk", { v: nuevas.map(p => p.nombre).join(", ") })); }
  e.target.value = "";
});
$("restaurar").addEventListener("click", () => { try { localStorage.removeItem("vr_polares"); } catch (e) { } pintarPolares(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => { });
